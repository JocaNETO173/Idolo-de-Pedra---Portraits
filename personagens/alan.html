<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="../css/executor.css">
  <title>RPG Portrait Overlay</title>

</head>

<body>

  <div class="portrait-shell">
    <img class="outer-frame" src="../img/-borda-executor.png" alt="Borda externa" />

    <div class="portrait-card">
      <img id="char-img" class="character-art" src="" alt="Personagem" />

      <div class="impeto-container">
        <div class="impeto-badge">ÍMPETO</div>
        <div class="impeto-icons" id="impeto-icons">
        </div>
      </div>

      <div class="ui-layer">
        <div class="status-row">
          <div class="badge">PV</div>
          <div class="value-text" id="pv-current">0</div>
          <div class="separator">/</div>
          <div class="grid-container" id="pv-grid"></div>
        </div>

        <div class="status-row">
          <div class="badge">PD</div>
          <div class="value-text" id="pd-current">0</div>
          <div class="separator">/</div>
          <div class="grid-container" id="pd-grid"></div>
        </div>
      </div>

      <div class="character-name" id="char-name">EDGAR</div>
    </div>
  </div>

  <script>
  const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycby2LP5DtT27RgwyosmCCIbQHwv4QML7cH09A85sijwM26t9rvg2gvYuF1w8pymBtRlq/exec";
  const PERSONAGEM_ALVO = "Alan";

  let characterData = {
    nome: "???",
    fotoUrl: "../img/Medo.png",
    pvMax: 0,
    pvAtual: 0,
    pdMax: 0,
    pdAtual: 0,
    impeto: 0
  };

  function renderGrid(containerId, max, atual) {
    const container = document.getElementById(containerId);
    container.innerHTML = "";
    const numMax = parseInt(max) || 0;
    const numAtual = parseInt(atual) || 0;

    for (let i = 0; i < numMax; i++) {
      const square = document.createElement("div");
      square.classList.add("stat-square");
      if (i < numAtual) {
        square.classList.add("active");
      } else {
        square.classList.add("inactive");
      }
      container.appendChild(square);
    }
  }

  function renderImpeto(quantidade) {
    const container = document.getElementById("impeto-icons");
    container.innerHTML = "";
    const numQuantidade = parseInt(quantidade) || 0;
    const raySvg = `
      <div class="ray-icon">
        <img src="../img/-impeto.png" alt="Raio">
      </div>
    `;
    for (let i = 0; i < numQuantidade && i < 3; i++) {
      container.innerHTML += raySvg;
    }
  }

  function updateOverlay(data) {
    if (data.nome) document.getElementById("char-name").innerText = data.nome;
    if (data.fotoUrl) document.getElementById("char-img").src = data.fotoUrl;

    document.getElementById("pv-current").innerText = data.pvAtual ?? 0;
    document.getElementById("pd-current").innerText = data.pdAtual ?? 0;

    renderGrid("pv-grid", data.pvMax, data.pvAtual);
    renderGrid("pd-grid", data.pdMax, data.pdAtual);
    renderImpeto(data.impeto);
  }

  updateOverlay(characterData);

  // Leitura limpa e direta do JSON do Apps Script
  async function fetchSheetData() {
    try {
      const response = await fetch(`${APPS_SCRIPT_URL}?t=${new Date().getTime()}`);

      if (!response.ok) {
        throw new Error(`Erro HTTP: ${response.status}`);
      }

      const listaPersonagens = await response.json();

      // Encontra o personagem Alan na lista JSON
      const dadosPersonagem = listaPersonagens.find(
        p => String(p.nome).trim().toLowerCase() === PERSONAGEM_ALVO.trim().toLowerCase()
      );

      if (dadosPersonagem) {
        updateOverlay(dadosPersonagem);
      } else {
        console.warn(`Personagem "${PERSONAGEM_ALVO}" não encontrado no JSON.`);
      }
    } catch (error) {
      console.error("Erro ao buscar dados do Apps Script:", error);
    }
  }

  fetchSheetData();
  setInterval(fetchSheetData, 1500);
</script>
</body>

</html>
