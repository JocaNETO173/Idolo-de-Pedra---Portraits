<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="../css/executor.css">
  <title>RPG Portrait Overlay</title>

</head>

<body>

  <div class="portrait-shell">
    <img class="outer-frame" src="../img/-borda-executor.png" alt="Borda externa" />

    <div class="portrait-card">
      <img id="char-img" class="character-art" src="" alt="Personagem" />

      <div class="impeto-container">
        <div class="impeto-badge">ÍMPETO</div>
        <div class="impeto-icons" id="impeto-icons">
        </div>
      </div>

      <div class="ui-layer">
        <div class="status-row">
          <div class="badge">PV</div>
          <div class="value-text" id="pv-current">0</div>
          <div class="separator">/</div>
          <div class="grid-container" id="pv-grid"></div>
        </div>

        <div class="status-row">
          <div class="badge">PD</div>
          <div class="value-text" id="pd-current">0</div>
          <div class="separator">/</div>
          <div class="grid-container" id="pd-grid"></div>
        </div>
      </div>

      <div class="character-name" id="char-name">EDGAR</div>
    </div>
  </div>

  <script>
    const CSV_URL = "COLE_AQUI_O_LINK_DO_CSV_GERADO_NO_GOOGLE_SHEETS";
    const PERSONAGEM_ALVO = "Alan";

    // Guarda o último estado estável para evitar o "vai e volta"
    let ultimoEstadoConhecido = null;

    function parseCSVLine(text) {
      let result = [];
      let current = '';
      let inQuotes = false;
      for (let i = 0; i < text.length; i++) {
        let char = text[i];
        if (char === '"') {
          inQuotes = !inQuotes;
        } else if (char === ',' && !inQuotes) {
          result.push(current.trim());
          current = '';
        } else {
          current += char;
        }
      }
      result.push(current.trim());
      return result.map(val => val.replace(/^"|"$/g, '').trim());
    }

    function renderGrid(containerId, max, atual) {
      const container = document.getElementById(containerId);
      if (!container) return;
      container.innerHTML = "";
      const numMax = parseInt(max) || 0;
      const numAtual = parseInt(atual) || 0;

      for (let i = 0; i < numMax; i++) {
        const square = document.createElement("div");
        square.classList.add("stat-square");
        if (i < numAtual) {
          square.classList.add("active");
        } else {
          square.classList.add("inactive");
        }
        container.appendChild(square);
      }
    }

    function renderImpeto(quantidade) {
      const container = document.getElementById("impeto-icons");
      if (!container) return;
      container.innerHTML = "";
      const numQuantidade = parseInt(quantidade) || 0;
      const raySvg = `
        <div class="ray-icon">
          <img src="../img/-impeto.png" alt="Raio">
        </div>
      `;
      for (let i = 0; i < numQuantidade && i < 3; i++) {
        container.innerHTML += raySvg;
      }
    }

    function updateOverlay(data) {
      if (data.nome && document.getElementById("char-name")) {
        document.getElementById("char-name").innerText = data.nome;
      }
      if (data.fotoUrl && document.getElementById("char-img")) {
        document.getElementById("char-img").src = data.fotoUrl;
      }

      if (document.getElementById("pv-current")) document.getElementById("pv-current").innerText = data.pvAtual ?? 0;
      if (document.getElementById("pd-current")) document.getElementById("pd-current").innerText = data.pdAtual ?? 0;

      renderGrid("pv-grid", data.pvMax, data.pvAtual);
      renderGrid("pd-grid", data.pdMax, data.pdAtual);
      renderImpeto(data.impeto);
    }

    async function fetchSheetData() {
      try {
        const response = await fetch(`${CSV_URL}&t=${new Date().getTime()}`, {
          cache: "no-store",
          headers: {
            "Cache-Control": "no-cache",
            "Pragma": "no-cache"
          }
        });

        if (!response.ok) throw new Error(`Erro HTTP: ${response.status}`);

        const textoCsv = await response.text();
        const linhas = textoCsv.split(/\r?\n/);

        for (let i = 1; i < linhas.length; i++) {
          if (!linhas[i].trim()) continue;
          let colunas = parseCSVLine(linhas[i]);
          
          if (colunas.length > 0 && colunas[0].toLowerCase() === PERSONAGEM_ALVO.toLowerCase()) {
            const dadosPersonagem = {
              nome: colunas[0],
              fotoUrl: colunas[1] || "",
              pvMax: Number(colunas[2]) || 0,
              pvAtual: Number(colunas[3]) || 0,
              pdMax: Number(colunas[4]) || 0,
              pdAtual: Number(colunas[5]) || 0,
              impeto: Number(colunas[6]) || 0
            };

            // CONDIÇÃO DE BLINTAGEM:
            // Só atualiza a tela se for a primeira leitura OU se os dados realmente mudaram em relação ao último estado seguro.
            // Se o Google entregar um dado antigo do cache, essa condição rejeita e evita o "vai e volta".
            if (!ultimoEstadoConhecido || JSON.stringify(dadosPersonagem) !== JSON.stringify(ultimoEstadoConhecido)) {
              ultimoEstadoConhecido = dadosPersonagem;
              updateOverlay(dadosPersonagem);
            }
            break;
          }
        }
      } catch (error) {
        console.error("Erro ao buscar CSV:", error);
      }
    }

    // Executa imediatamente e checa a cada 2 segundos
    fetchSheetData();
    setInterval(fetchSheetData, 2000);
  </script>
</body>

</html>
