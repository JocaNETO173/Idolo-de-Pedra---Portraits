<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="../css/analista.css">
  <title>RPG Portrait Overlay</title>

</head>

<body>

  <div class="portrait-shell">
    <img class="outer-frame" src="../img/-borda-analista.png" alt="Borda externa" />

    <div class="portrait-card">
      <img id="char-img" class="character-art" src="../img/Medo.png" alt="Personagem" />

      <div class="ui-layer">
        <div class="status-row">
          <div class="badge">PV</div>
          <div class="value-text" id="pv-current">0</div>
          <div class="separator">/</div>
          <div class="grid-container" id="pv-grid"></div>
        </div>

        <div class="status-row">
          <div class="badge">PD</div>
          <div class="value-text" id="pd-current">0</div>
          <div class="separator">/</div>
          <div class="grid-container" id="pd-grid"></div>
        </div>
      </div>

      <div class="character-name" id="char-name">???</div>
    </div>
  </div>

  <script>
    // 1. Cole aqui o ID da sua planilha (ex: 1BxiMVs0XRA5nFMdKvBdBZjgmUUqptlbs74OgvE2upms)
    const SHEET_ID = "1h90Tv243pGca2BFW53TgFgrjNqUvf6sGT3H734ujXXw";

    // 2. Cole aqui uma Google API Key pública (gratuita)
    const API_KEY = "AIzaSyBm3akLENKI1nI6lBp3L0Re73mchYcUozU";

    // Nome exato da aba e do personagem
    const ABA_NOME = "Página1"; // Mude para o nome da sua aba (ex: "Sheet1" ou "Personagens")
    const PERSONAGEM_ALVO = "Kênia";

    // Monta a URL oficial da API do Google v4 (Lê o intervalo A até G da aba)
    const API_URL = `https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/${ABA_NOME}!A:G?key=${API_KEY}`;

    let ultimoEstadoConhecido = null;

    function renderGrid(containerId, max, atual) {
      const container = document.getElementById(containerId);
      if (!container) return;
      container.innerHTML = "";
      const numMax = parseInt(max) || 0;
      const numAtual = parseInt(atual) || 0;

      for (let i = 0; i < numMax; i++) {
        const square = document.createElement("div");
        square.classList.add("stat-square");
        if (i < numAtual) {
          square.classList.add("active");
        } else {
          square.classList.add("inactive");
        }
        container.appendChild(square);
      }
    }

    function updateOverlay(data) {
      if (data.nome && document.getElementById("char-name")) {
        document.getElementById("char-name").innerText = data.nome;
      }
      if (data.fotoUrl && document.getElementById("char-img")) {
        document.getElementById("char-img").src = data.fotoUrl;
      }

      if (document.getElementById("pv-current")) document.getElementById("pv-current").innerText = data.pvAtual ?? 0;
      if (document.getElementById("pd-current")) document.getElementById("pd-current").innerText = data.pdAtual ?? 0;

      renderGrid("pv-grid", data.pvMax, data.pvAtual);
      renderGrid("pd-grid", data.pdMax, data.pdAtual);
    }

    async function fetchSheetData() {
      try {
        const response = await fetch(API_URL);
        if (!response.ok) throw new Error(`Erro HTTP API: ${response.status}`);

        const result = await response.json();
        const rows = result.values; // Retorna uma matriz de linhas e colunas

        if (!rows || rows.length === 0) return;

        // Pula o cabeçalho (começa no i = 1)
        for (let i = 1; i < rows.length; i++) {
          let colunas = rows[i];

          if (colunas && colunas[0] && colunas[0].trim().toLowerCase() === PERSONAGEM_ALVO.toLowerCase()) {
            const dadosPersonagem = {
              nome: colunas[0],
              fotoUrl: colunas[1] || "",
              pvMax: Number(colunas[2]) || 0,
              pvAtual: Number(colunas[3]) || 0,
              pdMax: Number(colunas[4]) || 0,
              pdAtual: Number(colunas[5]) || 0,
              impeto: Number(colunas[6]) || 0
            };

            const jsonAtual = JSON.stringify(dadosPersonagem);

            // Atualiza apenas se houver mudança real na base de dados oficial
            if (!ultimoEstadoConhecido || jsonAtual !== JSON.stringify(ultimoEstadoConhecido)) {
              ultimoEstadoConhecido = dadosPersonagem;
              updateOverlay(dadosPersonagem);
            }
            break;
          }
        }
      } catch (error) {
        console.error("Erro ao buscar dados da API do Google:", error);
      }
    }

    // Executa na carga e atualiza a cada 2 segundos direto na fonte limpa
    fetchSheetData();
    setInterval(fetchSheetData, 4000);
  </script>
</body>

</html>
